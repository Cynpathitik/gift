<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驿站迷踪 · 首页</title>
    
    <style>
        @font-face {
            font-family: 'HanYiPixel';
            src: url('fonts/HYPixel11pxU-2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f3f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'HanYiPixel', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.8;
            padding: 20px;
        }

        .modal {
            max-width: 720px;
            width: 100%;
            background: rgba(210, 180, 255, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 20px 40px rgba(140, 100, 200, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .story-text {
            color: #2d1b3d;
            margin-bottom: 2.5rem;
        }

        .story-text p {
            margin-bottom: 1.2rem;
            font-size: 16px;
        }

        .btn-login {
            display: inline-block;
            background: #d4b5ff;
            color: #1f0f2e;
            font-family: 'HanYiPixel', 'Courier New', monospace;
            font-size: 22px;
            padding: 0.6rem 3rem;
            border: 3px solid #3d2a4f;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 0 6px 0 #2d1b3d;
            transition: all 0.08s linear;
            background-color: #d4b5ff;
            line-height: 1.2;
        }

        .btn-login:hover {
            background: #c7a3f5;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #2d1b3d;
        }

        .btn-login:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #2d1b3d;
        }

        .hint {
            margin-top: 2rem;
            font-size: 12px;
            color: #4d3a5e;
            opacity: 0.7;
            border-top: 1px dashed rgba(80, 50, 100, 0.2);
            padding-top: 1.5rem;
        }

        .hint span {
            background: rgba(255, 255, 255, 0.3);
            padding: 0.2rem 0.8rem;
        }
    </style>
</head>
<body>
    <div class="modal">
        <div class="story-text">
            <p>你叫徐翼欢，是一个普通的女大学生。</p>
            <p>返校前最后几天，你的快递到达了学校的菜鸟驿站。<br>
            然而，返校当晚你去取快递，却发现它已经不知所踪。<br>
            当你想询问快递的工作人员时，他们却以快要下班为由拒绝了你，<br>
            而保卫科也过了可以查监控的时间。</p>
            <p>偷快递的贼究竟是谁？快递现在在哪里？<br>
            无奈之下，你打开校园论坛，想要搜索解决方法，<br>
            却发现一个置顶爆帖……</p>
        </div>

        <button class="btn-login" id="loginBtn">登录</button>

        <div class="hint">
            <span>✦ 点击登录 · 进入下一个节点 ✦</span>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            window.location.href = '2.html';
        });
    </script>
</body>
</html>
