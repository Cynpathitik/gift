<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谁有元小牛的联系方式 · 唐岛能源大学</title>
    
    <style>
        @font-face {
            font-family: 'HanYiPixel';
            src: url('fonts/HYPixel11pxU-2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8e3db;
            font-family: 'HanYiPixel', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.7;
            color: #1f1f1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            padding: 28px 32px 20px 32px;
        }

        .back-link {
            display: inline-block;
            color: #7a7a7a;
            font-size: 14px;
            text-decoration: none;
            padding: 4px 0 14px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.15s;
            cursor: pointer;
        }

        .back-link:hover {
            border-bottom-color: #b8a99a;
        }

        .back-link::before {
            content: "← ";
        }

        .post-title {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            padding: 6px 0 12px 0;
            border-bottom: 2px solid #f0ece6;
            line-height: 1.5;
        }

        /* ===== 楼主信息（含悬停弹窗） ===== */
        .op-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0 8px 0;
            font-size: 14px;
            color: #7a7a7a;
            position: relative;
        }

        .op-info .op-name {
            color: #1f1f1f;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: inline-block;
            width: fit-content;
            position: relative;
            padding-bottom: 2px;
            transition: color 0.15s;
        }

        .op-info .op-name::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #b8a99a;
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }

        .op-info .op-name:hover::after {
            transform: scaleX(1);
        }

        .op-info .op-name:hover {
            color: #6a5a4a;
        }

        .op-info .op-time {
            color: #b0a89c;
            font-size: 13px;
        }

        /* ===== 悬停弹窗（资料卡） ===== */
        .profile-popup {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid #d4c8ba;
            border-radius: 16px;
            padding: 16px 20px 18px 20px;
            min-width: 220px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.97);
        }

        .profile-popup.show {
            display: block;
        }

        .profile-popup .profile-inner {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .profile-popup .profile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #d4c8ba;
            flex-shrink: 0;
            background-image: url('leave.jpg');
            background-size: cover;
            background-position: center;
            background-color: #e8e3db;
        }

        .profile-popup .profile-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-popup .profile-name {
            font-size: 16px;
            font-weight: bold;
            color: #1a1a1a;
            letter-spacing: 0.3px;
        }

        .profile-popup .profile-name .badge {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: normal;
            margin-left: 4px;
        }

        .profile-popup .profile-hint {
            font-size: 12px;
            color: #b0a89c;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .profile-popup .profile-hint .heart {
            color: #e06060;
        }

        /* ===== 楼主发言 ===== */
        .op-content {
            background: #f8f6f2;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 6px 0 20px 0;
            border-left: 4px solid #d4c8ba;
            color: #2a2a2a;
            font-size: 15px;
            line-height: 1.8;
        }

        /* ===== 无回复提示 ===== */
        .no-reply {
            text-align: center;
            padding: 30px 0 20px 0;
            color: #b0a89c;
            font-size: 14px;
            border-bottom: 1px solid #f2eee8;
        }

        .no-reply .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        /* ===== 页码 ===== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 18px 0 4px 0;
            border-top: 2px solid #f0ece6;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border: 2px solid #ddd6cc;
            background: #ffffff;
            color: #5a554a;
            font-family: 'HanYiPixel', 'Courier New', monospace;
            font-size: 14px;
            cursor: default;
            user-select: none;
            border-radius: 4px;
        }

        .page-btn.active {
            background: #d4c8ba;
            border-color: #c4b6a6;
            color: #ffffff;
        }

        .page-btn.total {
            border-color: transparent;
            background: transparent;
            color: #b0a89c;
            font-size: 13px;
            min-width: auto;
            padding: 0 6px;
        }

        .page-btn:not(.active):not(.total) {
            background: #faf8f5;
        }

        .footer-input {
            padding: 14px 0 0 0;
            border-top: 2px solid #f0ece6;
            margin-top: 4px;
        }

        .input-placeholder {
            width: 100%;
            padding: 14px 20px;
            background: #f5f2ed;
            border-radius: 30px;
            color: #b0a89c;
            font-family: 'HanYiPixel', 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 0.5px;
            cursor: not-allowed;
            user-select: none;
            border: 1px solid #e3ddd4;
            text-align: left;
        }

        .input-placeholder::before {
            content: "✏️ ";
            font-size: 14px;
            opacity: 0.6;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px 10px;
            }
            .container {
                padding: 18px 16px 16px 16px;
                border-radius: 18px;
            }
            .post-title {
                font-size: 17px;
            }
            .op-content {
                font-size: 14px;
                padding: 14px 16px;
            }
            .profile-popup {
                min-width: 180px;
                padding: 14px 16px 16px 16px;
                left: -10px;
            }
            .profile-popup .profile-avatar {
                width: 46px;
                height: 46px;
            }
            .profile-popup .profile-name {
                font-size: 14px;
            }
            .page-btn {
                min-width: 30px;
                height: 30px;
                font-size: 12px;
                padding: 0 6px;
            }
            .input-placeholder {
                font-size: 13px;
                padding: 12px 16px;
            }
        }

        @media (max-width: 400px) {
            .post-title {
                font-size: 15px;
            }
            .op-content {
                font-size: 13px;
                padding: 12px 14px;
            }
            .profile-popup {
                min-width: 160px;
                padding: 12px 14px 14px 14px;
                left: -6px;
            }
            .profile-popup .profile-avatar {
                width: 40px;
                height: 40px;
            }
            .profile-popup .profile-name {
                font-size: 13px;
            }
            .profile-popup .profile-hint {
                font-size: 11px;
            }
            .page-btn {
                min-width: 26px;
                height: 26px;
                font-size: 11px;
                padding: 0 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== 返回按钮 ===== -->
    <div class="back-link" onclick="window.location.href='2.html'">返回论坛</div>

    <!-- ===== 帖子标题 ===== -->
    <div class="post-title">谁有元小牛的联系方式 能不能私我一下</div>

    <!-- ===== 楼主信息（含悬停弹窗） ===== -->
    <div class="op-info" id="opInfo">
        <span class="op-name" id="opName">楼主 · ◑.◑</span>
        <span class="op-time">2026年8月29日</span>

        <!-- 悬停弹窗（资料卡） -->
        <div class="profile-popup" id="profilePopup">
            <div class="profile-inner">
                <div class="profile-avatar"></div>
                <div class="profile-info">
                    <div class="profile-name">
                        ◑.◑
                        <span class="badge"># 楼主</span>
                    </div>
                    <div class="profile-hint">
                        <span class="heart">❤️</span> 对方是你的好友
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 楼主发言 ===== -->
    <div class="op-content">
        球球了 我真的很喜欢他家奶茶 哪个笔笔能找到店家啊😭
    </div>

    <!-- ===== 无回复提示 ===== -->
    <div class="no-reply">
        <span class="icon">💭</span>
        还没有回复，抢个沙发吧～
    </div>

    <!-- ===== 页码（共1页） ===== -->
    <div class="pagination">
        <span class="page-btn active">1</span>
        <span class="page-btn total">共1页</span>
    </div>

    <!-- ===== 底部输入框 ===== -->
    <div class="footer-input">
        <div class="input-placeholder">说点什么……</div>
    </div>

</div>

<script>
    (function() {
        const opName = document.getElementById('opName');
        const popup = document.getElementById('profilePopup');

        // ===== 悬停显示弹窗 =====
        opName.addEventListener('mouseenter', function(e) {
            popup.classList.add('show');
        });

        opName.addEventListener('mouseleave', function(e) {
            // 延迟隐藏，防止鼠标移动到弹窗上时闪烁
            setTimeout(() => {
                // 检查鼠标是否在弹窗内
                const rect = popup.getBoundingClientRect();
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                // 如果鼠标在弹窗范围内，不隐藏
                if (mouseX >= rect.left && mouseX <= rect.right &&
                    mouseY >= rect.top && mouseY <= rect.bottom) {
                    return;
                }
                popup.classList.remove('show');
            }, 100);
        });

        // 鼠标进入弹窗时保持显示
        popup.addEventListener('mouseenter', function() {
            popup.classList.add('show');
        });

        popup.addEventListener('mouseleave', function() {
            popup.classList.remove('show');
        });

        // ===== 点击昵称跳转到 dragon.html =====
        opName.addEventListener('click', function() {
            window.location.href = 'dragon.html';
            console.log('🐉 跳转到：dragon.html');
        });

        console.log('📄 帖子详情页已加载 (5.html)');
        console.log('👤 楼主：◑.◑');
        console.log('📌 悬停昵称显示好友资料卡（含 leave.jpg 头像）');
        console.log('📌 点击昵称跳转到 dragon.html');
        console.log('💬 本贴暂无回复');
    })();
</script>

</body>
</html>
